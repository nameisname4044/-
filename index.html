
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지? | 점심 메뉴 추천기</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="app">
        <header class="header">
            <div class="logo">LUNCH PICK</div>
            <h1>점심 메뉴<br><span>고민 그만</span></h1>
            <p class="subtitle">고민은 줄이고, 맛있는 점심을 선택하세요.</p>
        </header>

        <section class="recommend-section">
            <div class="recommend-icon">🍽️</div>
            <p class="recommend-label">TODAY'S PICK</p>
            <h2 id="result">오늘의 메뉴를 추천해 드립니다!</h2>
            <p id="resultMessage">버튼을 눌러 점심 메뉴를 골라보세요.</p>
            <button id="recommendBtn" class="recommend-btn">
                ✨ 점심 메뉴 추천받기
            </button>
        </section>

        <section class="menu-section">
            <div class="section-heading">
                <div>
                    <h2>메뉴 목록</h2>
                    <p>마음에 드는 메뉴를 추가하거나 삭제하세요.</p>
                </div>
                <span id="menuCount" class="menu-count">5개</span>
            </div>

            <form id="menuForm" class="add-form">
                <input
                    type="text"
                    id="menuInput"
                    placeholder="새로운 메뉴를 입력하세요"
                    maxlength="30"
                    autocomplete="off"
                    aria-label="추가할 메뉴 이름"
                >
                <button type="submit" class="add-btn">+ 메뉴 추가</button>
            </form>

            <p id="notice" class="notice" role="status" aria-live="polite"></p>

            <ul id="menuList" class="menu-list"></ul>

            <div id="emptyMessage" class="empty-message" hidden>
                <div class="empty-icon">🥢</div>
                <h3>등록된 메뉴가 없습니다.</h3>
                <p>새로운 점심 메뉴를 등록해 주세요!</p>
            </div>
        </section>

        <footer>
            <p>WHAT'S FOR LUNCH? · 맛있는 하루 되세요.</p>
        </footer>
    </main>
</body>
</html>
